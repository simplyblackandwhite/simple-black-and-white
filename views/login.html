<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Login — Simply Black and White Scanner</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png" />
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/main.css" />
  <style>
    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--color-ivory);
      padding: var(--space-6);
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: var(--color-surface);
      border-radius: var(--radius-lg);
      padding: var(--space-12) var(--space-8);
      box-shadow: var(--shadow-lg);
      text-align: center;
    }

    .login-card__monogram {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 2px solid var(--color-charcoal);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto var(--space-6);
      font-family: var(--font-heading);
      font-size: var(--text-lg);
      font-weight: 700;
      color: var(--color-charcoal);
    }

    .login-card__title {
      font-family: var(--font-heading);
      font-size: var(--text-2xl);
      color: var(--color-charcoal);
      margin-bottom: var(--space-2);
    }

    .login-card__subtitle {
      font-size: var(--text-sm);
      color: var(--color-text-muted);
      margin-bottom: var(--space-8);
    }

    .login-card__google-btn {
      display: inline-flex;
      align-items: center;
      gap: var(--space-3);
      padding: var(--space-4) var(--space-6);
      background: var(--color-charcoal);
      color: var(--color-ivory);
      border: none;
      border-radius: var(--radius-md);
      font-family: var(--font-body);
      font-size: var(--text-base);
      font-weight: 500;
      text-decoration: none;
      transition: background 0.2s ease;
      cursor: pointer;
    }

    .login-card__google-btn:hover,
    .login-card__google-btn:focus {
      background: var(--color-black);
      outline: var(--focus-ring);
      outline-offset: var(--focus-ring-offset);
    }

    .login-card__google-icon {
      width: 20px;
      height: 20px;
    }

    .login-card__note {
      margin-top: var(--space-6);
      font-size: var(--text-xs);
      color: var(--color-text-muted);
    }

    .login-card__error {
      margin-bottom: var(--space-6);
      padding: var(--space-3) var(--space-4);
      background: #fde8e8;
      color: #7a1e1e;
      border: 1px solid #f5b7b7;
      border-radius: var(--radius-sm);
      font-size: var(--text-sm);
    }

    .login-card__home {
      display: inline-block;
      margin-top: var(--space-6);
      font-size: var(--text-sm);
      color: var(--color-text-muted);
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .login-card__home:hover,
    .login-card__home:focus {
      color: var(--color-charcoal);
    }

    @media (prefers-reduced-motion: reduce) {
      .login-card__google-btn {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <main id="main-content" class="login-page">
    <div class="login-card" role="region" aria-labelledby="login-heading">
      <div class="login-card__monogram" aria-hidden="true">SBW</div>
      <h1 class="login-card__title" id="login-heading">Scanner Dashboard</h1>
      <p class="login-card__subtitle">Sign in to access the internal scanner, quote generator, and lead management tools.</p>

      <div id="login-error" class="login-card__error" role="alert" aria-live="polite" hidden></div>

      <a href="/auth/google" class="login-card__google-btn" aria-label="Sign in with Google">
        <svg class="login-card__google-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Sign in with Google
      </a>

      <p class="login-card__note">
        Access restricted to authorized Simply Black and White team members.
      </p>

      <a href="/" class="login-card__home">← Back to simplyblackandwhite.com</a>
    </div>
  </main>

  <script>
    // Show error if redirected with error param
    (function () {
      var params = new URLSearchParams(window.location.search);
      var error = params.get('error');
      var errorEl = document.getElementById('login-error');
      if (error && errorEl) {
        var messages = {
          unauthorized: 'Access denied. This dashboard is restricted to authorized team members only.',
          failed: 'Authentication failed. Please try again.',
        };
        errorEl.textContent = messages[error] || 'An error occurred. Please try again.';
        errorEl.hidden = false;
      }
    })();
  </script>
</body>
</html>
