<!-- ============================================================
     Simply Black and White — Site Header partial
     Includes: skip link, sticky nav, logo wordmark, mobile toggle
     WCAG AAA: skip link, keyboard nav, focus rings, aria labels
     ============================================================ -->
<a href="#main-content" class="skip-link">Skip to main content</a>

<header class="site-header" role="banner">
  <div class="container site-header__inner">

    <!-- Logo / Wordmark -->
    <a href="/" class="site-logo" aria-label="Simply Black and White — Home">
      Simply Black and White
    </a>

    <!-- Mobile nav toggle -->
    <button
      class="nav-toggle"
      aria-controls="primary-nav"
      aria-expanded="false"
      aria-label="Open navigation menu"
    >
      Menu
    </button>

    <!-- Primary Navigation -->
    <nav aria-label="Primary navigation">
      <ul class="site-nav" id="primary-nav" role="list">
        <li><a href="#services">Services</a></li>
        <li><a href="#why-accessibility">Why Accessibility</a></li>
        <li><a href="#scan">Free Scan</a></li>
        <li><a href="#about">About</a></li>
        <li>
          <a href="#contact" class="btn btn--primary btn--sm">
            Book a Consultation
          </a>
        </li>
      </ul>
    </nav>

  </div>
</header>

<!-- Mobile nav toggle script — inline, no dependencies -->
<script>
  (function () {
    const toggle = document.querySelector('.nav-toggle');
    const nav = document.getElementById('primary-nav');
    if (!toggle || !nav) return;

    toggle.addEventListener('click', function () {
      const isOpen = nav.classList.toggle('is-open');
      toggle.setAttribute('aria-expanded', String(isOpen));
      toggle.setAttribute('aria-label', isOpen ? 'Close navigation menu' : 'Open navigation menu');
      toggle.textContent = isOpen ? 'Close' : 'Menu';
    });

    // Close nav on Escape key
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && nav.classList.contains('is-open')) {
        nav.classList.remove('is-open');
        toggle.setAttribute('aria-expanded', 'false');
        toggle.setAttribute('aria-label', 'Open navigation menu');
        toggle.textContent = 'Menu';
        toggle.focus();
      }
    });

    // Close nav when a link is clicked (mobile)
    nav.querySelectorAll('a').forEach(function (link) {
      link.addEventListener('click', function () {
        nav.classList.remove('is-open');
        toggle.setAttribute('aria-expanded', 'false');
        toggle.setAttribute('aria-label', 'Open navigation menu');
        toggle.textContent = 'Menu';
      });
    });
  })();
</script>
